name: Build REG-linux LLVM self-hosted

on:
  workflow_dispatch:

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}
    cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  # No "Prepare shared downloads" job here, unlike the hosted build-llvm.yml.
  # There it exists because every leg starts on a fresh runner with an empty
  # dl/, so all 19 re-download the same ~1 GB source closure. Here DL_DIR
  # lives outside the workspace (see the compile step) and survives between
  # runs, which shares strictly more - across runs, not just within one - for
  # the cost of no artifact at all.
  build:
    name: Build LLVM binaries
    runs-on: self-hosted
    strategy:
      matrix:
        cpu: [arm1176jzf_s, cortex_a7, cortex_a9, cortex_a15_a7, cortex_a17, cortex_a35, cortex_a53, cortex_a55, cortex_a57, cortex_a72, cortex_a72_a53, cortex_a73_a53, cortex_a75_a55, cortex_a76, cortex_a76_a55, riscv64, saphira, x86_64, x86_64_v3]
        include:
          # MUSL 32 bit
          - target: bcm2835
            cpu: arm1176jzf_s
          # arch: armhf-musl
          - target: h3
            cpu: cortex_a7
          # arch: armv7-musl
          - target: s812
            cpu: cortex_a9
          # arch: armv7-musl
          - target: odroidxu4
            cpu: cortex_a15_a7
          # arch: armv7-musl
          - target: rk3288
            cpu: cortex_a17
          # arch: armv7-musl
          # MUSL 64 bit
          - target: rk3326
            cpu: cortex_a35
          # arch: aarch64-musl
          - target: h616
            cpu: cortex_a53
          # arch: aarch64-musl
          # - target: jz4770
          #   cpu: xburst
          #   arch: mips-musl
          # GLIBC
          - target: rk3568
            cpu: cortex_a55
          # arch: aarch64-glibc
          - target: l4t
            cpu: cortex_a57
          # arch: aarch64-glibc
          - target: bcm2711
            cpu: cortex_a72
          # arch: aarch64-glibc
          - target: rk3399
            cpu: cortex_a72_a53
          # arch: aarch64-glibc
          - target: s922x
            cpu: cortex_a73_a53
          # arch: aarch64-glibc
          - target: sdm845
            cpu: cortex_a75_a55
          # arch: aarch64-glibc
          - target: bcm2712
            cpu: cortex_a76
          # arch: aarch64-glibc
          - target: sm8250
            cpu: cortex_a76_a55
          # arch: aarch64-glibc
          - target: jh7110
            cpu: riscv64
          # arch: riscv-glibc
          - target: asahi
            cpu: saphira
          # arch: asahi-glibc
          - target: x86_64
            cpu: x86_64
          # arch: x86_64-glibc
          - target: x86_64_v3
            cpu: x86_64_v3
          # arch: x86_64-glibc
      fail-fast: false
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Clone repository
        id: clone_step
        uses: actions/checkout@v7.0.1
        with:
          repository: REG-Linux/REG-WIP
          token: ${{ secrets.REG_TOKEN }}
          submodules: true

      - name: Compile ${{ matrix.target }}
        id: compile_step
        env:
          GH_TOKEN: ${{ secrets.REG_TOKEN }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.password ${{ github.token }}
          
          # Merge buildroot patches
          CUSTOM_DIR=${{ github.workspace }}/custom BUILDROOT_DIR=${{ github.workspace }}/buildroot ${{ github.workspace }}/scripts/buildroot/mergeToBR.sh
          
          # Version
          llvmversion="$(grep -m 1 LLVM_PROJECT_VERSION_MAJOR buildroot/package/llvm-project/llvm-project.mk | sed -e 's/.*=[ ]*//')$(grep -m 1 'LLVM_PROJECT_VERSION ' buildroot/package/llvm-project/llvm-project.mk | sed -e 's/.*)//')"
          echo "llvmversion=${llvmversion}"
          echo "llvmversion=${llvmversion}" >> "$GITHUB_OUTPUT"
          
          # spirv-tools is keyed on its own Vulkan-SDK version; the translator on
          # the LLVM major AND spirv-headers, because it compiles against both and
          # they move on different cadences.
          spirvtoolsversion=$(sed -nE 's/^SPIRV_TOOLS_VERSION[[:space:]]*=[[:space:]]*(.*)$/\1/p' buildroot/package/spirv-tools/spirv-tools.mk | head -1)
          spirvheadersversion=$(sed -nE 's/^SPIRV_HEADERS_VERSION[[:space:]]*=[[:space:]]*(.*)$/\1/p' buildroot/package/spirv-headers/spirv-headers.mk | head -1)
          echo spirv versions: ${spirvtoolsversion} / ${spirvheadersversion}
          echo "spirvtoolsversion=${spirvtoolsversion}" >> "$GITHUB_OUTPUT"
          echo "spirvheadersversion=${spirvheadersversion}" >> "$GITHUB_OUTPUT"

          # Check if already released. llvm, clang and libclc ship as two
          # bundles - a host one and a target one - so both must be present
          # before a leg can skip.
          rel="https://github.com/REG-Linux/REG-llvm-binaries/releases/download"
          base_llvm="${rel}/llvm-${llvmversion}"
          base_st="${rel}/spirv-tools-${spirvtoolsversion}"
          base_slt="${rel}/spirv-llvm-translator-${llvmversion}-${spirvheadersversion}"
          have() { [ "$(curl -o /dev/null -s -Iw '%{http_code}' -L "$1")" -eq 200 ]; }
          if have "${base_llvm}/reglinux-llvm-host-${llvmversion}-${{ matrix.cpu }}.tar.xz" \
          && have "${base_llvm}/reglinux-llvm-target-${llvmversion}-${{ matrix.cpu }}.tar.xz" \
          && have "${base_st}/reglinux-spirv-tools-host-${spirvtoolsversion}-${{ matrix.cpu }}.tar.xz" \
          && have "${base_st}/reglinux-spirv-tools-target-${spirvtoolsversion}-${{ matrix.cpu }}.tar.xz" \
          && have "${base_slt}/reglinux-spirv-llvm-translator-host-${llvmversion}-${spirvheadersversion}-${{ matrix.cpu }}.tar.xz" \
          && have "${base_slt}/reglinux-spirv-llvm-translator-target-${llvmversion}-${spirvheadersversion}-${{ matrix.cpu }}.tar.xz"; then
            skipllvm=y
          fi
          
          if [ -z "$skipllvm" ]; then
            echo "Not yet released, proceeding with build"
            df -BG --output=avail ./
            
            # Patch Makefile to use 'reglinux-build:latest' docker image from ghcr.io
            sed -i '/^DOCKER_REPO/ s|reglinux|ghcr.io/reg-linux|' Makefile
            sed -i '/ build . -t /d' Makefile
            # fix for error "failed to set up container networking"
            sed -i 's| --rm | --rm --network host |' Makefile
            
            # Disable CCACHE
            sed -i "/BR2_CCACHE/d" configs/reglinux-board.common
            
            # The download cleanup the hosted workflow does (see
            # ci/scripts/ci-free-space.mk there) is deliberately not done here:
            # a self-hosted runner has the disk, and keeping dl/ makes reruns
            # cheap.
            #
            # Keep Buildroot's downloads outside the workspace. actions/checkout
            # runs with clean: true, so a workspace dl/ is wiped before every
            # leg and all 19 of them re-download the same tarballs. This also
            # fixes an outright failure: every container mounts
            # -v $(DL_DIR):/build/buildroot/dl, and docker creates a missing
            # bind-mount source as root:root, which the build - running as
            # -u $(id -u):$(id -g) - then cannot write into:
            #   mkdir: cannot create directory '/build/buildroot/dl/m4': Permission denied
            # Export it rather than passing DL_DIR=... on the make command line:
            # DL_DIR is not in the Makefile's WRAPPER_VARS, so a command-line
            # assignment would be forwarded into the container through MAKEFLAGS
            # and point Buildroot at a host path that does not exist there.
            export DL_DIR="${HOME}/reglinux-dl"
            mkdir -p "$DL_DIR"
            
            # Enable the flag to build LLVM/CLANG/LIBCLC from source
            # All three families, not just LLVM: otherwise the legs try to
            # download the very tarballs this workflow exists to produce.
            sed -i 's/#BR2_PACKAGE_LLVM_BUILD_FROM_SOURCE=y/BR2_PACKAGE_LLVM_BUILD_FROM_SOURCE=y/' configs/reglinux-board.common
            sed -i 's/#BR2_PACKAGE_SPIRV_TOOLS_BUILD_FROM_SOURCE=y/BR2_PACKAGE_SPIRV_TOOLS_BUILD_FROM_SOURCE=y/' configs/reglinux-board.common
            sed -i 's/#BR2_PACKAGE_SPIRV_LLVM_TRANSLATOR_BUILD_FROM_SOURCE=y/BR2_PACKAGE_SPIRV_LLVM_TRANSLATOR_BUILD_FROM_SOURCE=y/' configs/reglinux-board.common
            
            # No toolchain cache here, unlike the hosted build-llvm.yml.
            # This workflow builds with the default PARALLEL_BUILD=y and the
            # cache tarballs on REG-llvm-binaries are built with
            # PARALLEL_BUILD=n, so their output/ trees have an incompatible
            # layout - per-package/<pkg>/{host,target} versus a single
            # host/ and target/.
          fi
            
          # libclc depends on clang, which depends on llvm, so this one
          # invocation builds all three.
          if [ -z "$skipllvm" ]; then
            # The tree persists between runs on a self-hosted runner, so start
            # from a known state: a stale output/ built against a different
            # Buildroot would otherwise be harvested as if it were fresh.
            make ${{ matrix.target }}-clean
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=libclc ${{ matrix.target }}-pkg
            # host-lld too: nothing depends on it either, so it only builds
            # when named. Its lld goes in the llvm host bundle - LTO consumers
            # need a linker that reads bitcode, and binutils ld is not it.
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=host-lld ${{ matrix.target }}-pkg
            # host-spirv-tools explicitly: nothing in the target package's
            # dependency chain pulls it in, so without this the host bundle is
            # harvested from staging manifests only and host-glslang later fails
            # to configure with "SPIR-V tools not found".
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=spirv-tools ${{ matrix.target }}-pkg
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=host-spirv-tools ${{ matrix.target }}-pkg
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=spirv-llvm-translator ${{ matrix.target }}-pkg
            # The harvest's own tool, in no bundle: relocate_host_rpaths needs
            # it and runs outside the container, where there may be no system
            # patchelf.
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=host-patchelf ${{ matrix.target }}-pkg
          fi
          
          # Create packages
          #
          # make_tarball and relocate_host_rpaths below are
          # REG-WIP/scripts/linux/prebuild/prebuild-llvm.sh's functions, verbatim. The
          # two producers must behave identically, so keep them in step:
          # LC_ALL=C sort, archive-member dedup, RUNPATH relocation, and both safety
          # guards (empty list, and a tree that consumed the prebuilt instead of
          # building it).
          #
          # Unlike the hosted build-llvm.yml, it is the per-package branch that
          # fires here: this workflow builds with the default PARALLEL_BUILD=y,
          # so each package installs into its own per-package/<pkg>/{host,target}
          # and the --transform strips that prefix back off. The tarball layout
          # is identical either way, which is what llvm.mk's extract commands
          # expect.

          # Rewrite the RUNPATHs of a host bundle's own ELFs to be $ORIGIN-relative.
          #
          # cmake bakes an absolute HOST_DIR/lib into everything it links, and HOST_DIR is
          # *this* board's tree - /h3/per-package/host-spirv-tools/host/lib when the
          # cortex_a7 bundle is harvested on h3. Every other board on that CPU then
          # unpacks a bundle naming a directory it does not have: buildroot's
          # check-host-rpath rejects the binaries at the end of install-host, and because
          # DT_RUNPATH does not carry over to a library's own NEEDED entries, the
          # libraries cannot find each other at runtime either. That is what broke cha
          # (cortex_a7, like h3) on 2026-08-30.
          #
          # llvm.mk, spirv-tools.mk and spirv-llvm-translator.mk do the same rewrite when
          # they unpack, because bundles published before this existed cannot be fixed
          # from here. Both ends on purpose: this makes new bundles portable, the consumer
          # hooks keep the old ones working, and they cost nothing once every published
          # bundle is relocatable.
          #
          # $1 = file list, paths relative to the output dir (per-package prefix included)
          relocate_host_rpaths() {
          	listname="$1"

          	# Prefer the patchelf buildroot just built for this target. The tars run
          	# outside the build container, and neither a GitHub runner nor a
          	# developer's machine is guaranteed to have one installed.
          	patchelf=""
          	for c in per-package/host-patchelf/host/bin/patchelf host/bin/patchelf; do
          		if [ -x "${c}" ]; then
          			patchelf="${c}"
          			break
          		fi
          	done
          	[ -n "${patchelf}" ] || patchelf="$(command -v patchelf || :)"
          	if [ -z "${patchelf}" ]; then
          		echo "ERROR: no patchelf, so this bundle's RUNPATHs would keep naming"
          		echo "       $(pwd) - a path only this board has. Build it first:"
          		echo "       PKG=host-patchelf make <target>-pkg"
          		exit 1
          	fi

          	# host/bin/* and host/lib/*.so* only. Staging paths live deeper, under
          	# host/<tuple>/sysroot/usr/, and the [^/]+$ anchor keeps them out: those
          	# are target binaries whose RPATHs are the device's business, not ours.
          	grep -E '(^|/)host/(bin/[^/]+|lib/[^/]+\.so[^/]*)$' "${listname}" \
          		>"${listname}.elf" || :

          	n=0
          	while read -r f; do
          		[ -f "${f}" ] || continue
          		# patchelf materialises a symlink into a full copy; the target it
          		# points at is in the list too and carries the RPATH anyway.
          		[ -L "${f}" ] && continue
          		cur="$("${patchelf}" --print-rpath "${f}" 2>/dev/null)" || continue
          		# Leave alone anything that never had an RPATH - no need to invent one.
          		[ -n "${cur}" ] || continue
          		case "${f}" in
          			*/bin/*) rp='$ORIGIN/../lib' ;;
          			*)       rp='$ORIGIN' ;;
          		esac
          		# Rewrite unless it is already exactly right. Testing for "mentions
          		# $ORIGIN somewhere" is not enough: cmake emits
          		# "<HOST_DIR>/lib:$ORIGIN/../lib" for a fifth of these files, which
          		# check-host-rpath accepts - it matches on any one entry - while still
          		# naming the board that built the bundle. Nothing here has ever had a
          		# relative entry worth preserving; every RPATH in the published bundles
          		# is either purely absolute or that one absolute:$ORIGIN pair.
          		[ "${cur}" = "${rp}" ] && continue
          		"${patchelf}" --set-rpath "${rp}" "${f}" || continue
          		n=$((n + 1))
          	done <"${listname}.elf"
          	rm -f "${listname}.elf"

          	echo "    relocated ${n} RUNPATHs"
          }

          # Write one tarball from buildroot's own per-package manifests.
          #
          # Buildroot records exactly what each package installed in
          #   build/<pkg>-<ver>/.files-list-host.txt     (paths relative to HOST_DIR)
          #   build/<pkg>-<ver>/.files-list-staging.txt  (paths relative to STAGING_DIR)
          #   build/<pkg>-<ver>/.files-list.txt          (paths relative to TARGET_DIR)
          # as "<pkgname>,./path" lines, the same manifests prebuild-mames.sh uses.
          #
          # Package strictly from those. A per-package directory is NOT the set of files
          # its package installed: buildroot pre-populates it by rsyncing in every
          # dependency, so copying it wholesale - or sweeping it with a name heuristic
          # like `find -ipath '*llvm*'` - ships other packages' binaries. Those carry
          # RUNPATHs pointing into this build tree, and buildroot's check-host-rpath then
          # rejects them in whoever consumes the tarball.
          #
          # $1 = tarball, $2 = scratch list file, $3 = half (host|target), $4.. = build dirs
          #
          # The two halves come from different manifests: .files-list-host.txt and
          # .files-list-staging.txt describe HOST_DIR (staging lives under it as
          # <tuple>/sysroot), .files-list.txt describes TARGET_DIR.
          make_tarball() {
          	tarball="$1"; shift
          	listname="$1"; shift
          	half="$1"; shift

          	: >"${listname}"

          	for d in "$@"; do
          		[ -d "${d}" ] || continue

          		# The manifests' first field is the buildroot package name, which is
          		# also its per-package directory name.
          		pkg=""
          		for m in .files-list-host.txt .files-list-staging.txt .files-list.txt; do
          			if [ -f "${d}/${m}" ]; then
          				pkg="$(cut -d ',' -f 1 "${d}/${m}" | head -1)"
          				if [ -n "${pkg}" ]; then
          					break
          				fi
          			fi
          		done
          		[ -n "${pkg}" ] || continue

          		if [ -d per-package ]; then
          			hostpfx="per-package/${pkg}/host"
          			tgtpfx="per-package/${pkg}/target"
          		else
          			hostpfx="host"
          			tgtpfx="target"
          		fi

          		# STAGING_DIR lives under HOST_DIR as <tuple>/sysroot
          		sysroot="$(cd "${hostpfx}" 2>/dev/null && ls -d ./*/sysroot 2>/dev/null | sed 's|^\./||' | head -1 || true)"

          		if [ "${half}" = host ] && [ -f "${d}/.files-list-host.txt" ]; then
          			cut -d ',' -f 2- "${d}/.files-list-host.txt" \
          				| sed -e "s+^\./+${hostpfx}/+" >>"${listname}"
          		fi
          		if [ "${half}" = host ] && [ -f "${d}/.files-list-staging.txt" ] && [ -n "${sysroot}" ]; then
          			cut -d ',' -f 2- "${d}/.files-list-staging.txt" \
          				| sed -e "s+^\./+${hostpfx}/${sysroot}/+" >>"${listname}"
          		fi
          		if [ "${half}" = target ] && [ -f "${d}/.files-list.txt" ]; then
          			cut -d ',' -f 2- "${d}/.files-list.txt" \
          				| sed -e "s+^\./+${tgtpfx}/+" >>"${listname}"
          		fi
          	done

          	# Drop Python bytecode caches. None of the packages harvested here is a
          	# Python package - they land in the manifests only because buildroot derives
          	# them from a find snapshot around install, and running python during a
          	# build rewrites its own __pycache__ inside HOST_DIR. Shipping them is dead
          	# weight: PEP 3147 reaches a __pycache__ entry only *through* its source, and
          	# the sources are not in these bundles, so the files are unreachable.
          	#
          	# This is a subtraction of a known artifact, not a name-based selection -
          	# the list is still built purely from the manifests. If a genuine Python
          	# package is ever added to the harvest, revisit: its own bytecode ships with
          	# its sources and would be legitimate.
          	grep -v '/__pycache__/' "${listname}" >"${listname}.nopyc" || :
          	mv "${listname}.nopyc" "${listname}"

          	if [ ! -s "${listname}" ]; then
          		echo "    nothing to package for $(basename "${tarball}"), skipping"
          		return 0
          	fi

          	# LC_ALL=C: under a UTF-8 locale sort ignores punctuation at the primary
          	# collation level, so "LLVM-Config.cmake" and "LLVMConfig.cmake" compare
          	# equal and -u silently drops one of them. That cost the llvm tarball its
          	# LLVMConfig.cmake, and any dependent doing find_package(LLVM) then failed
          	# with "Could not find a package configuration file provided by LLVM".
          	LC_ALL=C sort -u -o "${listname}" "${listname}"

          	# Then dedupe again on the name the file will have *inside* the archive.
          	# With per-package directories every package gets its own HOST_DIR, so a file
          	# that several of them touch is listed once per package under a different
          	# per-package/<pkg>/ prefix - distinct lines, which sort -u keeps, but the
          	# --transform below collapses them to one member name. That put four copies
          	# of host/lib/python3.12/__pycache__/_sysconfigdata__*.pyc in the llvm bundle,
          	# same path, different bytes (python regenerated the cache in each tree), with
          	# whichever came last winning on extraction. Keep the first and drop the rest.
          	awk '{ k = $0; sub(/^per-package\/[^/]*\//, "", k); if (!seen[k]++) print }' \
          		"${listname}" >"${listname}.uniq"
          	mv "${listname}.uniq" "${listname}"

          	# A host bundle made entirely of staging paths means no .files-list-host.txt
          	# contributed anything - i.e. the package's host variant was never built, so
          	# nothing was installed into HOST_DIR. Staging lives *under* HOST_DIR as
          	# <tuple>/sysroot, so such a bundle still looks superficially right: correct
          	# top-level prefix, plausible file count. That is exactly how a spirv-tools
          	# host bundle of 45 staging paths and zero HOST_DIR files got published, and
          	# it only surfaced ~70k log lines into a consumer build when host-glslang
          	# could not find SPIRV-Tools-opt's cmake config.
          	# grep -cv, not -qv: ugrep's -q reports whether the *pattern* matched and
          	# ignores -v, so `! grep -qv` rejects everything under it. -c honours -v in
          	# both greps. It exits 1 on a zero count, hence the || :.
          	nonstaging=$(grep -cv '/sysroot/' "${listname}" || :)
          	if [ "${half}" = host ] && [ "${nonstaging:-0}" -eq 0 ]; then
          		echo "ERROR: every path in ${listname} is under <tuple>/sysroot, so this"
          		echo "       host bundle carries staging only and nothing for HOST_DIR."
          		echo "       The host variant of the package was probably never built -"
          		echo "       check that the build step names it (e.g. PKG=host-spirv-tools)."
          		exit 1
          	fi

          	# Guard against harvesting a tree that consumed the prebuilt LLVM instead
          	# of building it: there the manifests record everything the tarball
          	# extraction dropped in, rootfs skeleton included, and we would republish
          	# the pollution we are trying to remove. A from-source LLVM installs
          	# nothing under target/{dev,etc,sbin,var}.
          	if grep -qE '(^|/)target/(dev|etc|sbin|var)/|THIS_IS_NOT_YOUR_ROOT_FILESYSTEM' "${listname}"; then
          		echo "ERROR: ${listname} contains rootfs skeleton paths, so this tree"
          		echo "       was built against the prebuilt LLVM rather than from source."
          		echo "       Check BR2_PACKAGE_LLVM_BUILD_FROM_SOURCE=y in configs/reglinux-board.common."
          		exit 1
          	fi

          	echo "    $(wc -l <"${listname}") files -> $(basename "${tarball}")"

          	if [ "${half}" = host ]; then
          		relocate_host_rpaths "${listname}"
          	fi

          	# With per-package directories the members are prefixed by
          	# per-package/<pkg>/; strip that so the archive is always host/... plus
          	# target/..., which is the layout llvm.mk's extract commands expect.
          	#
          	# flags=rh keeps the rewrite to member names and hard-link targets;
          	# symlink targets (flag s, on by default) must stay as the package wrote
          	# them.
          	XZ_OPT=-9 tar -cJf "${tarball}" \
          		--transform='flags=rh;s|^per-package/[^/]*/||' \
          		--verbatim-files-from -T "${listname}"
          }

          if [ -z "$skipllvm" ]; then
            cd "${{ github.workspace }}/output/${{ matrix.target }}" || exit 1

            llvmdirs="build/llvm-* build/host-llvm-* build/clang-* build/host-clang-* build/libclc-* build/host-libclc-* build/host-lld-*"
            make_tarball "${{ github.workspace }}/reglinux-llvm-host-${llvmversion}-${{ matrix.cpu }}.tar.xz" \
              llvm-host-filelist.txt host $llvmdirs
            make_tarball "${{ github.workspace }}/reglinux-llvm-target-${llvmversion}-${{ matrix.cpu }}.tar.xz" \
              llvm-target-filelist.txt target $llvmdirs

            stdirs="build/spirv-tools-* build/host-spirv-tools-*"
            make_tarball "${{ github.workspace }}/reglinux-spirv-tools-host-${spirvtoolsversion}-${{ matrix.cpu }}.tar.xz" \
              st-host.txt host $stdirs
            make_tarball "${{ github.workspace }}/reglinux-spirv-tools-target-${spirvtoolsversion}-${{ matrix.cpu }}.tar.xz" \
              st-target.txt target $stdirs

            sltdirs="build/spirv-llvm-translator-* build/host-spirv-llvm-translator-*"
            make_tarball "${{ github.workspace }}/reglinux-spirv-llvm-translator-host-${llvmversion}-${spirvheadersversion}-${{ matrix.cpu }}.tar.xz" \
              slt-host.txt host $sltdirs
            make_tarball "${{ github.workspace }}/reglinux-spirv-llvm-translator-target-${llvmversion}-${spirvheadersversion}-${{ matrix.cpu }}.tar.xz" \
              slt-target.txt target $sltdirs
            echo "dorelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Artifacts
        if: ${{ steps.compile_step.outputs.dorelease == 'true' && ! cancelled() }}
        id: upload_artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reglinux-llvm-${{ steps.compile_step.outputs.llvmversion }}-${{ matrix.cpu }}
          compression-level: 0
          path: reglinux-*.tar.xz

      - name: Upload full-build.log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-build-log-${{ matrix.target }}
          path: ${{ github.workspace }}/output/${{ matrix.target }}/build/full-build.log

  create_release:
    name: Create release
    runs-on: self-hosted
    needs: build
    if: ${{ !cancelled() }}
    steps:
      - name: Clean stale artifacts from previous runs
        run: rm -rf artifacts && mkdir -p artifacts

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: reglinux-*
          path: artifacts
          merge-multiple: true

      # A matrix job cannot aggregate a "did anything build?" flag: all 18 legs
      # write the same job output and the last one to finish wins, so a leg that
      # skipped (its asset is already released) would suppress the release. The
      # artifacts are the aggregate - only legs that built something upload one -
      # and the version is already in their file names.
      # Three families, three releases - each tagged for what it is actually
      # keyed on, so bumping one leaves the other two untouched. Versions are
      # parsed out of the artifact names because this job has no checkout.
      - name: Work out which releases to create
        id: rel
        run: |
          shopt -s nullglob
          files=(artifacts/reglinux-*.tar.xz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No new tarballs were built; nothing to release."
            exit 0
          fi
          echo "Downloaded ${#files[@]} tarball(s)"

          llvmfiles=(artifacts/reglinux-llvm-host-*.tar.xz artifacts/reglinux-llvm-target-*.tar.xz)
          if [ ${#llvmfiles[@]} -gt 0 ]; then
            v="$(basename "${llvmfiles[0]}" | sed -nE 's/^reglinux-llvm-(host|target)-([0-9]+(\.[0-9]+)*)-.*\.tar\.xz$/\2/p')"
            [ -n "$v" ] && echo "llvmversion=${v}" >> "$GITHUB_OUTPUT" && echo "llvm -> tag llvm-${v}"
          fi

          stfiles=(artifacts/reglinux-spirv-tools-*.tar.xz)
          if [ ${#stfiles[@]} -gt 0 ]; then
            v="$(basename "${stfiles[0]}" | sed -nE 's/^reglinux-spirv-tools-(host|target)-([0-9]+(\.[0-9]+)*)-.*\.tar\.xz$/\2/p')"
            [ -n "$v" ] && echo "stversion=${v}" >> "$GITHUB_OUTPUT" && echo "spirv-tools -> tag spirv-tools-${v}"
          fi

          sltfiles=(artifacts/reglinux-spirv-llvm-translator-*.tar.xz)
          if [ ${#sltfiles[@]} -gt 0 ]; then
            # two versions in this name: <llvm>-<spirv-headers>. CPU names all
            # start with a letter, so the numeric groups cannot run into them.
            v="$(basename "${sltfiles[0]}" | sed -nE 's/^reglinux-spirv-llvm-translator-(host|target)-([0-9]+(\.[0-9]+)*)-([0-9]+(\.[0-9]+)*)-.*\.tar\.xz$/\2-\4/p')"
            [ -n "$v" ] && echo "sltversion=${v}" >> "$GITHUB_OUTPUT" && echo "translator -> tag spirv-llvm-translator-${v}"
          fi

      - name: Release llvm
        if: ${{ steps.rel.outputs.llvmversion != '' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: artifacts/reglinux-llvm-*.tar.xz
          tag_name: llvm-${{ steps.rel.outputs.llvmversion }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: llvm/clang/libclc ${{ steps.rel.outputs.llvmversion }}

      - name: Release spirv-tools
        if: ${{ steps.rel.outputs.stversion != '' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: artifacts/reglinux-spirv-tools-*.tar.xz
          tag_name: spirv-tools-${{ steps.rel.outputs.stversion }}
          prerelease: false
          make_latest: false
          generate_release_notes: true
          name: spirv-tools ${{ steps.rel.outputs.stversion }}

      - name: Release spirv-llvm-translator
        if: ${{ steps.rel.outputs.sltversion != '' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: artifacts/reglinux-spirv-llvm-translator-*.tar.xz
          tag_name: spirv-llvm-translator-${{ steps.rel.outputs.sltversion }}
          prerelease: false
          make_latest: false
          generate_release_notes: true
          name: spirv-llvm-translator ${{ steps.rel.outputs.sltversion }}

      # Keep the release list bounded: the three newest of each family this
      # workflow publishes, older ones deleted along with their tags (the same
      # --cleanup-tag idiom the toolchain cache already uses).
      #
      # The filter is an ALLOWLIST of the tags this workflow itself creates,
      # never a denylist. toolchain-<cpu> caches, hand-made releases and older
      # naming schemes cannot match these patterns, so they are never at risk.
      # Pruning is scoped to the families actually released in this run.
      - name: Prune old releases
        if: ${{ steps.rel.outputs.llvmversion != '' || steps.rel.outputs.stversion != '' || steps.rel.outputs.sltversion != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_VER: ${{ steps.rel.outputs.llvmversion }}
          ST_VER: ${{ steps.rel.outputs.stversion }}
          SLT_VER: ${{ steps.rel.outputs.sltversion }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh is not installed on this runner; skipping release pruning"
            exit 0
          fi
          KEEP=3
          prune() {
            pattern="$1"
            echo "== keeping the ${KEEP} newest releases matching ${pattern}"
            # Newest first, restrict to this family, then drop the first KEEP.
            # grep is allowed to match nothing, hence the || true.
            doomed="$(gh release list --limit 200 --json tagName,createdAt \
                        --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
                      | grep -E "${pattern}" | tail -n +$((KEEP + 1)) || true)"
            if [ -z "${doomed}" ]; then
              echo "   nothing to remove"
              return 0
            fi
            printf '%s\n' "${doomed}" | while read -r tag; do
              [ -n "${tag}" ] || continue
              echo "   deleting ${tag}"
              gh release delete "${tag}" --cleanup-tag --yes \
                || echo "::warning::could not delete release ${tag}"
            done
          }
          if [ -n "${LLVM_VER}" ]; then prune '^llvm-[0-9]'; fi
          if [ -n "${ST_VER}" ];   then prune '^spirv-tools-[0-9]'; fi
          if [ -n "${SLT_VER}" ];  then prune '^spirv-llvm-translator-[0-9]'; fi
